<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoMEDIA | Bibliothèque de Réalisations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandPrimary: '#e26137', brandSecondary: '#0f3066', brandDark: '#0a0a0c', brandLight: '#f4f0eb' },
                    fontFamily: { editorial: ['Playfair Display', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { background-color: #0a0a0c; color: #f4f0eb; overflow-x: hidden; }
        .shelf-scroll::-webkit-scrollbar { display: none; }
        .shelf-scroll { -ms-overflow-style: none; scrollbar-width: none; overflow-y: hidden; }

        /* Livres de l'étagère */
        .book {
            position: relative; display: block; height: 100%; width: 24px; overflow: hidden;
            border-radius: 2px; border: 1px solid rgba(255,255,255,.1); background: #0a0a0c;
            opacity: .45; cursor: pointer; transform-origin: bottom;
            transition: width .6s cubic-bezier(.22,1,.36,1), opacity .4s ease, box-shadow .4s ease, border-color .4s ease;
        }
        .book .cover { width: 100%; height: 100%; background-size: cover; background-position: center; filter: grayscale(1); transition: filter .5s ease; }
        .book .shade { position: absolute; inset: 0; background: rgba(0,0,0,.5); transition: opacity .4s ease; }
        .book .info {
            position: absolute; inset: 0; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; background: linear-gradient(to top, #0a0a0c, rgba(10,10,12,.4), transparent);
            transition: opacity .4s ease .1s;
        }
        .book:hover, .book:focus-visible {
            width: 90px; opacity: 1; border-color: #e26137; box-shadow: 0 0 25px rgba(226,97,55,.6); outline: none;
        }
        .book:hover .cover, .book:focus-visible .cover { filter: none; }
        .book:hover .shade, .book:focus-visible .shade { opacity: 0; }
        .book:hover .info, .book:focus-visible .info { opacity: 1; }
        @media (min-width: 640px) { .book { width: 28px; } .book:hover, .book:focus-visible { width: 120px; } }
        @media (min-width: 768px) { .book { width: 34px; } .book:hover, .book:focus-visible { width: 160px; } }

        /* Carrousel */
        #viewport { cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
        #viewport.grabbing { cursor: grabbing; }
        #carousel-track img, #carousel-track video { -webkit-user-drag: none; }

        @media (prefers-reduced-motion: reduce) { .book, .book * { transition: none !important; } }
    </style>
</head>
<body class="font-sans min-h-screen bg-brandDark flex flex-col justify-between">

    <main class="pt-16 pb-12 px-4 flex-grow flex flex-col justify-center max-w-7xl mx-auto w-full">

        <div id="intro" class="text-center mb-10">
            <span class="text-brandPrimary uppercase tracking-widest font-extrabold text-xs block mb-2">NOS ARCHIVES</span>
            <h1 class="text-3xl md:text-5xl font-editorial text-white">L'Étagère Visuelle</h1>
            <p class="text-gray-400 max-w-md mx-auto mt-2 text-xs md:text-sm">
                Chaque livre est une catégorie. Choisissez-en un et cliquez pour l'ouvrir.
            </p>
        </div>

        <!-- Étagère (générée depuis BOOKS) -->
        <div class="relative w-full border-b-4 border-brandLight/40 pb-1 mb-16">
            <div id="library-shelf" class="shelf-scroll flex items-end justify-start overflow-x-auto px-4 h-[350px] md:h-[420px] relative z-10 bottom-[-4px]"></div>
            <div class="absolute bottom-[-16px] left-0 w-full h-4 bg-gradient-to-b from-black/60 to-transparent"></div>
        </div>
    </main>

    <!-- Fenêtre du carrousel -->
    <div id="carousel-modal" class="hidden fixed inset-0 z-50 bg-brandDark/95 backdrop-blur-md flex-col items-center justify-center p-4 opacity-0"
        role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" id="close-btn"
            class="absolute top-6 right-6 text-white bg-white/10 hover:bg-brandPrimary px-5 py-2.5 rounded-full text-xs uppercase tracking-wider font-bold transition-all z-50">
            <i class="fas fa-times mr-2"></i> Fermer
        </button>

        <div id="modal-head" class="text-center mb-8 max-w-xl">
            <span id="modal-count" class="text-brandPrimary uppercase tracking-widest font-extrabold text-xs block mb-2"></span>
            <h2 id="modal-title" class="text-2xl md:text-4xl font-editorial text-brandLight italic"></h2>
            <p class="text-gray-400 text-xs mt-2">Glissez pour parcourir · Passez la souris pour ralentir</p>
        </div>

        <div id="viewport" class="relative w-full overflow-hidden py-4">
            <div id="carousel-track" class="flex w-max items-center will-change-transform"></div>
            <div class="pointer-events-none absolute inset-y-0 left-0 w-12 md:w-32 bg-gradient-to-r from-brandDark to-transparent"></div>
            <div class="pointer-events-none absolute inset-y-0 right-0 w-12 md:w-32 bg-gradient-to-l from-brandDark to-transparent"></div>
        </div>
    </div>

    <footer class="bg-brandDark border-t border-white/5 py-8 text-center">
        <div class="max-w-7xl mx-auto px-6 flex flex-col items-center justify-center gap-4">
            <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 border border-white/20 rounded-full text-sm font-semibold tracking-wide text-white hover:text-brandPrimary hover:border-brandPrimary transition-all duration-300 transform hover:scale-105 shadow-lg bg-white/5">
                <i class="fas fa-arrow-left mr-3 text-xs"></i> Retour à la page principale
            </a>
            <p class="text-gray-500 text-[10px] mt-2">2026 &copy; RoMEDIA. Tous droits réservés. Changer pour évoluer.</p>
        </div>
    </footer>

    <script>
        /* =====================================================================
           ZONE À MODIFIER : c'est ici que vous ajoutez vos photos et vidéos.
           Vous n'avez rien d'autre à toucher dans la page.
           (Évitez les guillemets doubles dans les titres.)
           ===================================================================== */

        // Chaque bloc { ... } est UN LIVRE sur l'étagère = UNE CATÉGORIE.
        //
        //   titre  = nom de la catégorie (affiché quand on survole le livre)
        //   cover  = (facultatif) image de couverture du livre.
        //            Sans cover, la première photo de la catégorie est utilisée.
        //   medias = liste des photos ET vidéos de cette catégorie.
        //            Photos : "images/nom.jpg"     Vidéos : "videos/nom.mp4"
        //            (le type est reconnu avec l'extension : .mp4, .webm, .mov)
        //
        // POUR AJOUTER UN LIVRE : copiez un bloc complet, collez-le dans la liste et changez les valeurs.
        // POUR AJOUTER UNE PHOTO OU UNE VIDÉO : ajoutez son chemin dans la liste medias du bon livre.
        // IMPORTANT : chaque bloc se termine par une virgule, et chaque chemin aussi, sauf le dernier.
        //
        // Un livre sans aucun média n'est pas affiché.
        // Pour les vidéos : déposez le fichier dans un dossier "videos" du dépôt GitHub
        // et gardez-le léger (idéalement sous 25 Mo). Les vidéos tournent sans son.

        const BOOKS = [
            { titre: "Portrait",
              cover: "images/RNP_0598-2.jpg",
              medias: ["images/RNP_8961-1.jpg", "images/RNP_0598-2.jpg", "images/RNP_7120-1.jpg",
                       "images/58668_03.jpg", "images/loop-AI.jpg", "images/IMG_0055-1.jpg",
                       "images/IMG_7811-1.jpg", "images/RNP_4768-1.jpg"] },

            { titre: "Événement",
              cover: "images/RNP_4322-1.jpg",
              medias: ["images/RNP_4690-1.jpg", "images/RNP_8961-1.jpg",
                       "images/RNP_4322-1.jpg", "images/RNP_8954-1.jpg"] },

            { titre: "Infographie",
              cover: "images/restaurant-window-mockup.jpg",
              medias: ["images/IMG_0055-1.jpg", "images/58668_03.jpg", "images/IMG_7811-1.jpg",
                       "images/restaurant-window-mockup.jpg", "images/RNP_7120-1.jpg"] },

            // ----- Exemples prêts à l'emploi : retirez les // au début des lignes et remplacez les chemins -----
            // { titre: "Vidéo",
            //   cover: "images/couverture-video.jpg",
            //   medias: ["videos/reel-1.mp4", "videos/reel-2.mp4"] },
            //
            // { titre: "Nature",
            //   medias: ["images/nature-1.jpg", "images/nature-2.jpg"] },
            //
            // { titre: "Animalier",
            //   medias: ["images/animal-1.jpg", "images/animal-2.jpg"] },
            //
            // { titre: "Corporatif",
            //   medias: ["images/corpo-1.jpg", "images/corpo-2.jpg"] },
        ];

        /* =====================================================================
           FIN DE LA ZONE À MODIFIER : le reste fait fonctionner la page.
           ===================================================================== */

        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const isVideo = s => /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(s);
        const coverOf = b => b.cover || b.medias.find(m => !isVideo(m)) || "";
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

        const shelf = $("library-shelf");
        const HEIGHTS = ["h-[85%]", "h-[92%]", "h-[88%]", "h-[95%]", "h-[90%]"];
        const shown = BOOKS.map((b, i) => ({ b, i })).filter(o => o.b.medias && o.b.medias.length);

        /* ---------- Étagère ---------- */
        function bookHTML(b, id, pos) {
            const cover = coverOf(b);
            const n = b.medias.length;
            const hasVideo = b.medias.some(isVideo);
            return `
                <div class="book-wrap flex-none ${HEIGHTS[pos % HEIGHTS.length]} mx-[2px] md:mx-1">
                    <button type="button" class="book" data-id="${id}" aria-label="Ouvrir la catégorie ${esc(b.titre)}">
                        <div class="cover" ${cover ? `style="background-image:url('${esc(cover)}')"` : ""}></div>
                        <div class="shade"></div>
                        <div class="info">
                            ${hasVideo ? `<i class="fas fa-play absolute top-2 right-2 text-[8px] text-white/80"></i>` : ""}
                            <span class="block text-[8px] text-brandPrimary font-bold uppercase tracking-wider truncate">${n} ${n > 1 ? "médias" : "média"}</span>
                            <span class="block text-[10px] md:text-xs font-bold text-white truncate">${esc(b.titre)}</span>
                        </div>
                    </button>
                </div>`;
        }

        function drawShelf() {
            if (!shown.length) {
                shelf.innerHTML = `<p class="m-auto text-gray-500 text-sm">Aucune collection pour le moment.</p>`;
                return;
            }
            shelf.innerHTML = shown.map((o, pos) => bookHTML(o.b, o.i, pos)).join("");
            /* Centrage sans rogner le début quand l'étagère déborde */
            shelf.firstElementChild.style.marginLeft = "auto";
            shelf.lastElementChild.style.marginRight = "auto";

            /* Les livres montent se ranger sur l'étagère, l'un après l'autre */
            gsap.fromTo(".book-wrap",
                { y: 90, opacity: 0 },
                { y: 0, opacity: 1, duration: reduceMotion ? 0.01 : 1, delay: 0.25, stagger: 0.12,
                  ease: "power3.out", clearProps: "transform,opacity" });
        }

        /* Choisir un livre : il se sort un peu de l'étagère, puis s'ouvre */
        let pulled = null, pending = false;
        shelf.addEventListener("click", e => {
            const btn = e.target.closest(".book");
            if (!btn || pending || isOpen) return;
            pending = true;
            pulled = btn.parentElement;
            gsap.to(pulled, { y: -14, duration: 0.35, ease: "power2.out" });
            setTimeout(() => { pending = false; openCollection(Number(btn.dataset.id), btn); }, reduceMotion ? 0 : 240);
        });

        /* ---------- Carrousel ---------- */
        const modal = $("carousel-modal");
        const track = $("carousel-track");
        const viewport = $("viewport");
        const ctl = { s: 1 };                // facteur de vitesse (0 = pause, 1 = normal)
        const SPEED = reduceMotion ? 0 : 55; // pixels par seconde
        let x = 0, vx = 0, period = 0;
        let dragging = false, lastX = 0, lastT = 0;
        let isOpen = false, openToken = 0, lastFocus = null;

        function mediaHTML(src, b, k) {
            const inner = isVideo(src)
                ? `<video src="${esc(src)}" muted loop autoplay playsinline preload="auto" draggable="false" class="h-full w-auto max-w-none block"></video>`
                : `<img src="${esc(src)}" alt="${esc(b.titre)} – photo ${k + 1}" draggable="false" class="h-full w-auto max-w-none block">`;
            return `<div class="flex-none mr-6 h-[58vh] md:h-[66vh] rounded-xl overflow-hidden border border-white/10 shadow-2xl bg-white/5">${inner}</div>`;
        }

        const ready = el => new Promise(res => {
            const done = () => res();
            if (el.tagName === "IMG") {
                if (el.complete) return res();
                el.addEventListener("load", done, { once: true });
            } else {
                if (el.readyState >= 1) return res();
                el.addEventListener("loadedmetadata", done, { once: true });
            }
            el.addEventListener("error", done, { once: true });
            setTimeout(done, 5000);
        });

        function tick(_, delta) {
            if (!period) return;
            const dt = Math.min(delta, 50) / 1000;
            if (!dragging) {
                x += (-SPEED * ctl.s + vx) * dt;
                vx *= Math.exp(-dt / 0.3);       // l'élan après un glissement s'estompe doucement
            }
            x %= period;
            if (x > 0) x -= period;
            track.style.transform = `translate3d(${x}px,0,0)`;
        }

        async function openCollection(id, opener) {
            const b = BOOKS[id];
            if (!b || !b.medias.length) return;
            const token = ++openToken;
            isOpen = true;
            lastFocus = opener || null;

            $("modal-title").textContent = b.titre;
            $("modal-count").textContent = `${b.medias.length} ${b.medias.length > 1 ? "médias" : "média"}`;

            const setHTML = b.medias.map((m, k) => mediaHTML(m, b, k)).join("");
            track.innerHTML = setHTML;
            x = 0; vx = 0; period = 0;
            track.style.transform = "translate3d(0,0,0)";
            gsap.set(track, { opacity: 0 });

            gsap.killTweensOf(modal);
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.body.style.overflow = "hidden";
            gsap.fromTo(modal, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" });
            gsap.fromTo("#modal-head > *", { y: 24, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.8, stagger: 0.1, delay: 0.1, ease: "power3.out" });
            $("close-btn").focus({ preventScroll: true });

            /* On attend que les médias soient chargés pour mesurer la boucle */
            await Promise.all([...track.querySelectorAll("img, video")].map(ready));
            if (token !== openToken) return;

            period = track.getBoundingClientRect().width;
            let guard = 0;
            while (track.getBoundingClientRect().width < period + viewport.clientWidth + 100 && guard++ < 12) {
                track.insertAdjacentHTML("beforeend", setHTML);
            }
            track.querySelectorAll("video").forEach(v => { v.muted = true; v.play().catch(() => {}); });

            gsap.to(track, { opacity: 1, duration: 0.8, ease: "power2.out" });
            ctl.s = 0;
            gsap.to(ctl, { s: 1, duration: 1.4, ease: "power2.inOut", overwrite: true });
            gsap.ticker.remove(tick);
            gsap.ticker.add(tick);
        }

        function closeCollection() {
            if (!isOpen) return;
            isOpen = false;
            openToken++;
            gsap.to(modal, {
                opacity: 0, duration: 0.4, ease: "power2.in",
                onComplete: () => {
                    if (isOpen) return;
                    gsap.ticker.remove(tick);
                    modal.classList.add("hidden");
                    modal.classList.remove("flex");
                    track.innerHTML = "";
                    period = 0;
                    document.body.style.overflow = "";
                    /* Le livre retourne se ranger sur l'étagère */
                    if (pulled) {
                        gsap.to(pulled, { y: 0, duration: 0.6, ease: "power3.out", clearProps: "transform" });
                        pulled = null;
                    }
                    if (lastFocus) lastFocus.focus({ preventScroll: true });
                }
            });
        }

        $("close-btn").addEventListener("click", closeCollection);
        modal.addEventListener("click", e => { if (e.target === modal) closeCollection(); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") closeCollection(); });

        /* Ralentissement doux au survol (souris seulement) */
        viewport.addEventListener("pointerenter", e => {
            if (e.pointerType === "mouse" && !dragging) gsap.to(ctl, { s: 0, duration: 0.8, ease: "power2.out", overwrite: true });
        });
        viewport.addEventListener("pointerleave", e => {
            if (e.pointerType === "mouse") gsap.to(ctl, { s: 1, duration: 1, ease: "power2.inOut", overwrite: true });
        });

        /* Glissement à la souris ou au doigt, avec un peu d'élan */
        viewport.addEventListener("pointerdown", e => {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            dragging = true;
            lastX = e.clientX;
            lastT = performance.now();
            vx = 0;
            viewport.classList.add("grabbing");
            viewport.setPointerCapture(e.pointerId);
        });
        viewport.addEventListener("pointermove", e => {
            if (!dragging) return;
            const now = performance.now();
            const dx = e.clientX - lastX;
            x += dx;
            vx = Math.max(-3000, Math.min(3000, 0.7 * vx + 0.3 * (dx / Math.max(1, now - lastT) * 1000)));
            lastX = e.clientX;
            lastT = now;
        });
        const endDrag = () => { dragging = false; viewport.classList.remove("grabbing"); };
        viewport.addEventListener("pointerup", endDrag);
        viewport.addEventListener("pointercancel", endDrag);

        /* ---------- Démarrage ---------- */
        gsap.from("#intro > *", { y: 20, opacity: 0, duration: 0.9, stagger: 0.12, ease: "power3.out" });
        drawShelf();
    </script>
</body>
</html>
